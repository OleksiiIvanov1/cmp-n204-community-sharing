version: "3.9"

services:

  web:
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - db

  db:
    image: mysql
    restart: always
    env_file:
      - ./.env
    ports:
      - "3309:3306"
    volumes:
      - ./db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    env_file:
      - ./.env
    ports:
      - "8082:80"